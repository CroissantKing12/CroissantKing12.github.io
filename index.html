<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 40%, #4a2c7a 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f0e6ff;
            overflow-x: hidden;
        }

        /* Sidebar toggle */
        #sidebar-toggle {
            position: fixed;
            top: 18px;
            left: 18px;
            width: 44px;
            height: 44px;
            background: rgba(45, 27, 78, 0.9);
            border: 1px solid rgba(167, 139, 250, 0.45);
            border-radius: 12px;
            color: #e9d5ff;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        #sidebar-toggle:hover {
            background: rgba(124, 58, 237, 0.7);
            transform: scale(1.05);
        }

        /* Sidebar */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: rgba(26, 10, 46, 0.95);
            backdrop-filter: blur(16px);
            border-right: 1px solid rgba(167, 139, 250, 0.3);
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            padding: 80px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #sidebar.open {
            transform: translateX(0);
        }

        .sidebar-title {
            color: #c4b5fd;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            padding-left: 10px;
        }

        .app-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 14px 16px;
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 12px;
            color: #e9d5ff;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            text-align: left;
        }

        .app-btn:hover {
            background: rgba(167, 139, 250, 0.22);
            border-color: rgba(167, 139, 250, 0.5);
            transform: translateX(4px);
        }

        .app-btn .icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        /* Overlay */
        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }

        #overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Toast notification */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(45, 27, 78, 0.95);
            border: 1px solid rgba(167, 139, 250, 0.5);
            color: #e9d5ff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Main card */
        .card {
            background: rgba(45, 27, 78, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.35);
            border-radius: 20px;
            padding: 2.5rem 2.75rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(139, 92, 246, 0.15);
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 1.75rem;
            color: #e9d5ff;
            letter-spacing: -0.02em;
        }

        .input-group {
            margin-bottom: 1.25rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.9rem 1.1rem;
            font-size: 1rem;
            border: 2px solid rgba(167, 139, 250, 0.4);
            border-radius: 12px;
            background: rgba(26, 10, 46, 0.6);
            color: #f5f3ff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="password"]::placeholder {
            color: #a78bfa;
            opacity: 0.7;
        }

        input[type="password"]:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 3px rgba(167, 139, 250, 0.25);
        }

        button.submit-btn {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
            filter: brightness(1.08);
        }

        button.submit-btn:active {
            transform: translateY(0);
        }

        .hint {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #c4b5fd;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <!-- Sidebar toggle -->
    <button id="sidebar-toggle" title="Open menu">☰</button>

    <!-- Sidebar -->
    <div id="sidebar">
        <div class="sidebar-title">Apps</div>

        <button class="app-btn" onclick="contactSupport()">
            <span class="icon">✉️</span>
            Contact Support
        </button>

        <button class="app-btn" onclick="freeLink()">
            <span class="icon">🔗</span>
            Free Link
        </button>

        <button class="app-btn" onclick="recommendations()">
            <span class="icon">⭐</span>
            Recommendations
        </button>
    </div>

    <!-- Overlay -->
    <div id="overlay"></div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- Main content -->
    <div class="card">
        <h1>Enter password</h1>
        <div class="input-group">
            <input type="password" id="pass" placeholder="Password" autocomplete="off">
        </div>
        <button class="submit-btn" onclick="checkPass()">Submit</button>
        <p class="hint">Hint: 4 Numbers</p>
    </div>

    <script>
        // ===== Sidebar controls =====
        const toggleBtn = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('show');
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }

        toggleBtn.addEventListener('click', () => {
            sidebar.classList.contains('open') ? closeSidebar() : openSidebar();
        });

        overlay.addEventListener('click', closeSidebar);

        // ===== Toast helper =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ===== Apps =====
        function contactSupport() {
            const email = "15116@andersonprep.org";
            navigator.clipboard.writeText(email).then(() => {
                showToast("Email copied to clipboard");
            }).catch(() => {
                // Fallback
                const temp = document.createElement("textarea");
                temp.value = email;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand("copy");
                document.body.removeChild(temp);
                showToast("Email copied to clipboard");
            });
            closeSidebar();
        }

        function freeLink() {
            showToast("You Thought");
            closeSidebar();
        }

        function recommendations() {
            window.open("https://forms.gle/dfeM5ZdETXCFo2pUA", "_blank");
            closeSidebar();
        }

        // ===== Password logic =====
        var encodedUrl = [66,94,94,90,89,16,5,5,76,89,94,95,78,79,68,94,89,75,88,79,67,68,92,79,68,94,69,88,89,4,89,25,4,75,71,75,80,69,68,75,93,89,4,73,69,71,5,67,68,78,79,82,4,66,94,71,70];
        var key = 42;
        var targetUrl = encodedUrl.map(function(c) { return String.fromCharCode(c ^ key); }).join('');

        function djb2(str) {
            var hash = 5381;
            for (var i = 0; i < str.length; i++) {
                hash = ((hash * 33) + str.charCodeAt(i)) >>> 0;
            }
            return hash;
        }

        function checkPass() {
            var input = document.getElementById('pass').value;
            fetch('hwoepigh32high.txt')
                .then(function(res) { return res.text(); })
                .then(function(hashText) {
                    var expectedHash = hashText.trim();
                    if (String(djb2(input)) === expectedHash) {
                        var win = window.open('about:blank', '_blank');
                        if (win) {
                            win.document.write(
                                '<iframe src="' + targetUrl + '" ' +
                                'style="width:100%; height:100%; border:0; position:absolute; top:0; left:0;"></iframe>'
                            );
                            win.document.close();
                        } else {
                            alert("Popup blocked. Enable popups for this site.");
                        }
                    } else {
                        alert("Incorrect password.");
                    }
                })
                .catch(function() {
                    alert("Could not load password file.");
                });
        }
    </script>
</body>
</html>
