<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 40%, #4a2c7a 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f0e6ff;
        }

        .card {
            background: rgba(45, 27, 78, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.35);
            border-radius: 20px;
            padding: 2.8rem 2.5rem;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 2.8rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #e9d5ff;
            margin-bottom: 0.6rem;
        }

        p {
            color: #c4b5fd;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
            line-height: 1.5;
        }

        a.button {
            display: block;
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        a.button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
            filter: brightness(1.08);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⭐</div>
        <h1>Recommendations</h1>
        <p>Share your recommendations or feedback using the form below.</p>
        
        <a class="button" href="https://forms.gle/CCSWptJTMNpdWdU76" target="_blank">
            Open Form
        </a>
    </div>
</body>
</html>
