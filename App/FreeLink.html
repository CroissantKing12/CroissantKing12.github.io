<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Link</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 40%, #4a2c7a 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f0e6ff;
        }

        .card {
            background: rgba(45, 27, 78, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(167, 139, 250, 0.35);
            border-radius: 20px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            color: #e9d5ff;
            letter-spacing: -0.02em;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You Thought</h1>
    </div>
</body>
</html>
